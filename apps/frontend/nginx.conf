server {
    listen 80;
    
    # Diretório onde os arquivos de build do Vite foram copiados
    root /usr/share/nginx/html;
    index index.html;

    # Configuração principal para o funcionamento do React Router
    location / {
        # 1. Tenta carregar o arquivo exato ($uri)
        # 2. Tenta carregar o diretório ($uri/)
        # 3. Se não encontrar, redireciona para o index.html
        try_files $uri $uri/ /index.html;
    }

    # Otimização: Cache agressivo para os assets estáticos gerados pelo Vite
    # O Vite automaticamente adiciona hashes aos nomes dos arquivos JS/CSS (ex: main.a3b4c5.js)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Prevenção padrão de exibição de arquivos ocultos (ex: .git, .env)
    location ~ /\. {
        deny all;
    }
}