# NGINX DO FRONTEND (nginx.conf referenciado no Dockerfile do frontend)
server {
    # IMPORTANTE: Como o Dockerfile faz EXPOSE 8080, este NGINX deve ouvir na 8080
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Otimização de cache para arquivos do Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Prevenção de acesso a arquivos ocultos
    location ~ /\. {
        deny all;
    }

    # Redirecionamento SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}