# Define que a validação de mensagem de commit também será acionada
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # 1. VERIFICAÇÕES GERAIS E DE SEGURANÇA
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace         # Remove espaços em branco no final das linhas
      - id: end-of-file-fixer           # Garante que arquivos terminem com uma linha vazia
      - id: check-yaml                  # Valida a sintaxe de todos os arquivos .yml/.yaml
      - id: check-merge-conflict        # Impede commits se houver marcadores de conflito (<<<<<<<)
      - id: check-added-large-files     # Impede o commit de arquivos maiores que 5MB (ex: binários)
        args: ['--maxkb=5000']
      - id: detect-private-key          # CRÍTICO: Impede o vazamento acidental de chaves (.pem, rsa, etc)

  # 2. PADRONIZAÇÃO DE COMMITS (CONVENTIONAL COMMITS)
  # Essencial para que o release-please gere as tags, o CHANGELOG e as releases automaticamente
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # 3. INFRAESTRUTURA (TERRAFORM / OCI)
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt               # Executa 'terraform fmt' para padronizar o HCL
      - id: terraform_validate          # Executa 'terraform validate' para checar a sintaxe
        args:
          - --tf-init-args=-upgrade

  # 4. APLICAÇÕES (HOOKS LOCAIS PARA FRONTEND E BACKEND)
  - repo: local
    hooks:
      # Frontend: ESLint + tsc apenas se arquivos TS/JS mudarem
      - id: frontend-lint
        name: Frontend Lint (ESLint + tsc)
        entry: npm --prefix apps/frontend run lint
        language: system
        files: ^apps/frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      # Backend: mesmas verificações da CI (black + ruff)
      - id: backend-black
        name: Backend Format (black)
        entry: python -m black --check apps/backend
        language: system
        files: ^apps/backend/.*\.py$
        pass_filenames: false

      - id: backend-ruff
        name: Backend Lint (ruff)
        entry: python -m ruff check apps/backend
        language: system
        files: ^apps/backend/.*\.py$
        pass_filenames: false