services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laudos}
      POSTGRES_USER: ${POSTGRES_USER:-laudos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laudos_dev_only}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-laudos} -d $${POSTGRES_DB:-laudos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "80:8080"
    depends_on:
      - backend

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend/storage:/app/storage
    env_file:
      - ./apps/backend/.env
    environment:
      - ENVIRONMENT=dev
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-laudos}:${POSTGRES_PASSWORD:-laudos_dev_only}@db:5432/${POSTGRES_DB:-laudos}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
