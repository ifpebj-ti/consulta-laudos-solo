version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/backend"
    target-branch: "develop"
    commit-message:
      prefix: "deps"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    target-branch: "develop"
    commit-message:
      prefix: "deps"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    commit-message:
      prefix: "ci"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/backend"
    target-branch: "develop"
    commit-message:
      prefix: "deps"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/apps/frontend"
    target-branch: "develop"
    commit-message:
      prefix: "deps"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/environments/prod"
    target-branch: "develop"
    commit-message:
      prefix: "deps"
    schedule:
      interval: "monthly"
