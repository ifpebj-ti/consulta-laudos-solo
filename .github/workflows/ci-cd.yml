name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  # ==========================================================================
  # Validation, Lint and Tests
  # ==========================================================================
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Terraform Validation
      # ----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format and Validate
        working-directory: ./infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      # ----------------------------------------------------------------------
      # Frontend Validation
      # ----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: npm ci

      - name: Frontend Linting
        working-directory: ./apps/frontend
        run: npm run lint

      - name: Frontend Tests
        working-directory: ./apps/frontend
        run: npm run test -- --run

      # ----------------------------------------------------------------------
      # Backend Validation (FastAPI)
      # ----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./apps/backend
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f "pyproject.toml" ]; then
            pip install .
          fi

      - name: Check Code Formatting
        working-directory: ./apps/backend
        run: |
          black . --check

      - name: Run Linter
        working-directory: ./apps/backend
        run: |
          ruff check .

      - name: Run Unit Tests
        working-directory: ./apps/backend
        run: |
          pytest -v

  # ==========================================================================
  # Build and Push Images
  # ==========================================================================
  build-and-push:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Oracle Cloud Infrastructure Registry (OCIR)
        uses: docker/login-action@v3
        with:
          registry: <region>.ocir.io
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: |
            <region>.ocir.io/<namespace>/frontend:latest
            <region>.ocir.io/<namespace>/frontend:${{ github.sha }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          push: true
          tags: |
            <region>.ocir.io/<namespace>/backend:latest
            <region>.ocir.io/<namespace>/backend:${{ github.sha }}

  # ==========================================================================
  # Infrastructure Deployment
  # ==========================================================================
  terraform-apply:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Apply
        working-directory: ./infra/environments/prod
        env:
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          TF_VAR_private_key: ${{ secrets.OCI_PRIVATE_KEY }}
          TF_VAR_region: ${{ secrets.OCI_REGION }}
        run: |
          terraform init
          terraform apply -auto-approve
