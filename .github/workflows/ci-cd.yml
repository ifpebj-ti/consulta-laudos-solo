name: CI/CD Pipeline

# Terraform deploy to production has been moved to manual execution.
# Run: terraform apply manually from infra/environments/prod or add a
# separate workflow_dispatch workflow for infrastructure changes.

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  # ==========================================================================
  # Validation, Lint and Tests
  # ==========================================================================
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # Terraform Validation
      # ----------------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format and Validate
        working-directory: ./infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      # ----------------------------------------------------------------------
      # Frontend Validation
      # ----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./apps/frontend
        run: npm ci

      - name: Frontend Linting
        working-directory: ./apps/frontend
        run: npm run lint

      - name: Frontend Tests
        working-directory: ./apps/frontend
        run: npm run test -- --run

      # ----------------------------------------------------------------------
      # Backend Validation (FastAPI)
      # ----------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: ./apps/backend
        run: |
          python -m pip install --upgrade pip

          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi

          if [ -f "requirements-dev.txt" ]; then
            pip install -r requirements-dev.txt
          fi

          if [ -f "pyproject.toml" ]; then
            pip install .
          fi

      - name: Check Code Formatting
        working-directory: ./apps/backend
        run: |
          black . --check

      - name: Run Linter
        working-directory: ./apps/backend
        run: |
          ruff check .

      - name: Run Unit Tests with Coverage
        working-directory: ./apps/backend
        run: |
          pytest -v --cov=src --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: apps/backend/coverage.xml
          retention-days: 30

  # ==========================================================================
  # Build and Push Images to GHCR (multi-arch)
  # ==========================================================================
  build-push-ghcr:
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/consulta-laudos-frontend:latest
            ghcr.io/${{ github.repository_owner }}/consulta-laudos-frontend:${{ github.sha }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/consulta-laudos-backend:latest
            ghcr.io/${{ github.repository_owner }}/consulta-laudos-backend:${{ github.sha }}

  # ==========================================================================
  # Vulnerability Scanning with Trivy
  # ==========================================================================
  trivy-scan:
    needs: test-and-lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [frontend, backend]

    steps:
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/consulta-laudos-${{ matrix.image }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.sarif
          retention-days: 30

  # ==========================================================================
  # Code Quality Scanning with CodeQL
  # ==========================================================================
  # code-scanning:
  #   needs: test-and-lint
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     security-events: write

  #   steps:
  #     - name: Checkout Repository
  #       uses: actions/checkout@v4

  #     - name: Initialize CodeQL
  #       uses: github/codeql-action/init@v3
  #       with:
  #         languages: python, javascript-typescript

  #     - name: Autobuild
  #       uses: github/codeql-action/autobuild@v3

  #     - name: Perform CodeQL Analysis
  #       uses: github/codeql-action/analyze@v3

  # ==========================================================================
  # Automated Release with release-please
  # ==========================================================================
  release:
    needs: [trivy-scan, code-scanning]
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Release Please
        id: release_please
        uses: googleapis/release-please-action@v4
        with:
          release-type: simple
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release with GHCR image URIs
        if: ${{ steps.release_please.outputs.release_created }}
        uses: actions/github-script@v7
        with:
          script: |
            const { data: release } = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.release_please.outputs.id }},
            });

            const imageSection = [
              '',
              '## Docker Images',
              `- \`ghcr.io/${{ github.repository_owner }}/consulta-laudos-frontend:${{ steps.release_please.outputs.tag_name }}\``,
              `- \`ghcr.io/${{ github.repository_owner }}/consulta-laudos-backend:${{ steps.release_please.outputs.tag_name }}\``,
            ].join('\n');

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ steps.release_please.outputs.id }},
              body: release.body + imageSection,
            });
