name: Sincronizar Main com Develop

# Depois que a main recebe um merge (release ou hotfix), traz de volta para a develop
# o que existir so na main (ex.: commit de release do release-please: CHANGELOG, manifest, version.txt).

on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: read

jobs:
  merge-main-back-to-develop:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar se a develop precisa da main
        id: diff
        run: |
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "A develop já contém a main. Nada a sincronizar."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar branch de sincronização (merge sem sobrescrever a develop)
        if: steps.diff.outputs.needed == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B sync-main-to-develop origin/develop
          # Merge comum: se houver conflito o job falha e a sincronização é feita à mão.
          git merge --no-ff origin/main -m "chore: sincroniza main com develop"
          git push --force-with-lease origin sync-main-to-develop

      - name: Abrir Pull Request para a develop (se ainda não existir)
        if: steps.diff.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existente=$(gh pr list --base develop --head sync-main-to-develop --state open --json number --jq 'length')
          if [ "$existente" = "0" ]; then
            gh pr create \
              --base develop \
              --head sync-main-to-develop \
              --title "chore: sincroniza main com develop" \
              --body "Criado automaticamente após o merge na main, para manter a develop atualizada."
          else
            echo "Já existe um PR aberto de sync-main-to-develop."
          fi